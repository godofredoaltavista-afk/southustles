<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="holo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8ad4"/>
      <stop offset="30%" stop-color="#c08bff"/>
      <stop offset="60%" stop-color="#6d9bff"/>
      <stop offset="100%" stop-color="#57e6ff"/>
    </linearGradient>
    <radialGradient id="orbGrad" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#a99bff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#6d5efc" stop-opacity="0"/>
    </radialGradient>
    <filter id="inkTexture" x="-20%" y="-60%" width="140%" height="220%">
      <feTurbulence type="fractalNoise" baseFrequency="0.010 0.045" numOctaves="3" seed="7" result="noise">
        <animate attributeName="baseFrequency" dur="14s" values="0.010 0.045;0.014 0.038;0.010 0.045" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="9" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="#09090b"/>
  <rect width="1200" height="320" fill="url(#holo)" opacity="0.045"/>

  <!-- ambient holographic orb, echoes the hero-glb three.js orb -->
  <circle cx="150" cy="80" r="140" fill="url(#orbGrad)" filter="url(#soft)">
    <animate attributeName="cy" values="80;110;80" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1080" cy="250" r="120" fill="url(#orbGrad)" filter="url(#soft)" opacity="0.8">
    <animate attributeName="cy" values="250;215;250" dur="11s" repeatCount="indefinite"/>
  </circle>

  <!-- loader-style scan track, echoes #loader .loader-track__fill -->
  <rect x="0" y="304" width="1200" height="3" fill="#1a1a1f"/>
  <rect x="0" y="304" width="360" height="3" fill="url(#holo)">
    <animate attributeName="width" values="80;1200;80" dur="6s" repeatCount="indefinite"/>
  </rect>

  <text x="600" y="168" text-anchor="middle" font-family="Arial, 'Segoe UI', sans-serif" font-weight="900"
        font-size="98" letter-spacing="2" fill="url(#holo)" filter="url(#inkTexture)">SOUTH HUSTLES</text>
  <text x="600" y="216" text-anchor="middle" font-family="'Courier New', monospace" font-weight="500"
        font-size="21" letter-spacing="7" fill="#b7b7bf">CREATIVE&#160;STUDIO</text>
  <text x="600" y="252" text-anchor="middle" font-family="Georgia, serif" font-style="italic"
        font-size="19" fill="#82828c">direction &#183; technology &#183; emotion</text>
</svg>
