<!doctype html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f0e8" />
    <title>Apacheta</title>
    <!--
      Bootstrap de tema ANTES del primer paint. Sin esto hay un flash blanco
      en cada carga cuando el usuario eligió dark. Cosechado de southustles.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('apacheta-theme');
          if (t !== 'dark' && t !== 'light') {
            t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {
          /* private mode: el default del atributo alcanza */
        }
      })();
    </script>
